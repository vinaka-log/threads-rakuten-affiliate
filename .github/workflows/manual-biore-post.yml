name: Manual publish Biore mist post

on:
  push:
    branches: [cursor/biore-mist-affiliate-1864]
    paths:
      - ".github/workflows/manual-biore-post.yml"
      - "scripts/publish_biore_mist.py"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_PUBLISH_DELAY_SEC: "8"
      THREADS_REPLY_GAP_SEC: "5"
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Require Threads secrets
        run: |
          missing=0
          for key in THREADS_ACCESS_TOKEN THREADS_USER_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
      - name: Publish Biore mist thread now
        run: python scripts/publish_biore_mist.py
