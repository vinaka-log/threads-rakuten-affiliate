name: Daily ask chitchat extras

# 伸びたアイス雑談と同系統を、通常枠とは別に毎日2本追加。
# 11:00 JST / 16:00 JST（既存枠と被らない時間）
# 季節ネタ + 軽いトレンド/ニュース（スポーツ・生活寄りRSS）

on:
  schedule:
    # 11:00 JST = 02:00 UTC
    - cron: "0 2 * * *"
    # 16:00 JST = 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "1 (11:00) or 2 (16:00)"
        required: true
        default: "1"
      dry_run:
        description: "Dry run (print only, do not publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ask-chitchat-extra
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_PUBLISH_DELAY_SEC: "8"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHITCHAT_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: src:.
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve slot
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "dry_run=1" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=0" >> "$GITHUB_OUTPUT"
            fi
          else
            case "${{ github.event.schedule }}" in
              "0 2 * * *") echo "slot=1" >> "$GITHUB_OUTPUT" ;;
              "0 7 * * *") echo "slot=2" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unknown schedule" >&2; exit 1 ;;
            esac
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Require secrets for publish
        if: steps.pick.outputs.dry_run != '1'
        run: |
          missing=0
          for key in THREADS_ACCESS_TOKEN THREADS_USER_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
      - name: Publish ask chitchat
        run: |
          ARGS=(--slot "${{ steps.pick.outputs.slot }}")
          if [ "${{ steps.pick.outputs.dry_run }}" = "1" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/publish_ask_chitchat.py "${ARGS[@]}"
      - name: Commit pool / ledger if changed
        if: success() && steps.pick.outputs.dry_run != '1'
        run: |
          if git diff --quiet -- data/posted.json data/ask_chitchat_pool.json data/trend_seeds.json; then
            echo "No data file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json data/ask_chitchat_pool.json data/trend_seeds.json
          git commit -m "chore: ledger ask-chitchat extras"
          git push
