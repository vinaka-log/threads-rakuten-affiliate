name: Threads Rakuten daily post

# 毎日3回 JST（Actions無料枠節約）。
#   共働きリアル苦悩 1本: 08:00（再利用優先）
#   どうでもいい雑談 1本: 15:00
#   商品紹介(アフィ・答え合わせ型) 1本: 20:00

on:
  schedule:
    # 08:00 JST = 23:00 UTC (previous day) : slot 0 struggle
    - cron: "0 23 * * *"
    # 15:00 JST = 06:00 UTC : slot 1 chitchat
    - cron: "0 6 * * *"
    # 20:00 JST = 11:00 UTC : slot 2 item
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do not publish / do not update ledger)"
        type: boolean
        default: true
      slot:
        description: "0..2 (0=struggle 08:00, 1=chitchat 15:00, 2=item 20:00)"
        required: false
        default: ""
      genre:
        description: "Optional Rakuten genreId (empty = rotate by date+slot)"
        required: false
        default: ""

concurrency:
  group: threads-rakuten-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      THREADS_PUBLISH_DELAY_SEC: "8"
      THREADS_REPLY_GAP_SEC: "5"
      TZ: Asia/Tokyo
      PYTHONPATH: src:.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require secrets for publish
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          missing=0
          for key in THREADS_ACCESS_TOKEN THREADS_USER_ID RAKUTEN_APPLICATION_ID RAKUTEN_ACCESS_KEY RAKUTEN_AFFILIATE_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "See README.md for setup"
            exit 1
          fi

      - name: Resolve slot from schedule
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * *") echo "THREADS_SLOT=0" >> "$GITHUB_ENV" ;;
            "0 6 * * *") echo "THREADS_SLOT=1" >> "$GITHUB_ENV" ;;
            "0 11 * * *") echo "THREADS_SLOT=2" >> "$GITHUB_ENV" ;;
            *) echo "Could not map schedule to slot: ${{ github.event.schedule }}" >&2; exit 1 ;;
          esac

      - name: Post to Threads
        id: post
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          if [ -n "${{ inputs.slot }}" ]; then
            ARGS+=(--slot "${{ inputs.slot }}")
          elif [ -n "${THREADS_SLOT:-}" ]; then
            ARGS+=(--slot "${THREADS_SLOT}")
          fi
          if [ -n "${{ inputs.genre }}" ]; then
            ARGS+=(--genre "${{ inputs.genre }}")
          fi
          python src/post.py "${ARGS[@]}"

      - name: Commit ledger if changed
        if: ${{ success() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- data/posted.json data/chitchat_pool.json data/reuse.json; then
            echo "No data file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json data/chitchat_pool.json data/reuse.json
          git commit -m "chore: update posted ledger / chitchat pool"
          git push
