name: Threads Rakuten daily post

# 毎日10回 JST（repo は public のため Actions 枠は消費しない）。
#   アンケート3 / 雑談3 / ジブリ大喜利2 / 商品紹介2

on:
  schedule:
    # 08:00 JST = 23:00 UTC (previous day) : slot 0 ask
    - cron: "0 23 * * *"
    # 09:30 JST = 00:30 UTC : slot 1 chitchat
    - cron: "30 0 * * *"
    # 11:00 JST = 02:00 UTC : slot 2 ogiri
    - cron: "0 2 * * *"
    # 12:30 JST = 03:30 UTC : slot 3 ask
    - cron: "30 3 * * *"
    # 14:00 JST = 05:00 UTC : slot 4 chitchat
    - cron: "0 5 * * *"
    # 16:00 JST = 07:00 UTC : slot 5 item
    - cron: "0 7 * * *"
    # 18:00 JST = 09:00 UTC : slot 6 ogiri
    - cron: "0 9 * * *"
    # 19:30 JST = 10:30 UTC : slot 7 ask
    - cron: "30 10 * * *"
    # 21:00 JST = 12:00 UTC : slot 8 chitchat
    - cron: "0 12 * * *"
    # 22:00 JST = 13:00 UTC : slot 9 item
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do not publish / do not update ledger)"
        type: boolean
        default: true
      slot:
        description: "0..9 (0/3/7=ask, 1/4/8=chitchat, 2/6=ogiri, 5/9=item)"
        required: false
        default: ""
      genre:
        description: "Optional Rakuten genreId (empty = rotate by date+slot)"
        required: false
        default: ""

concurrency:
  group: threads-rakuten-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      THREADS_PUBLISH_DELAY_SEC: "8"
      THREADS_IMAGE_PUBLISH_DELAY_SEC: "20"
      THREADS_REPLY_GAP_SEC: "5"
      TZ: Asia/Tokyo
      PYTHONPATH: src:.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require secrets for publish
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          missing=0
          for key in THREADS_ACCESS_TOKEN THREADS_USER_ID RAKUTEN_APPLICATION_ID RAKUTEN_ACCESS_KEY RAKUTEN_AFFILIATE_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "See README.md for setup"
            exit 1
          fi

      - name: Resolve slot from schedule
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * *") echo "THREADS_SLOT=0" >> "$GITHUB_ENV" ;;
            "30 0 * * *") echo "THREADS_SLOT=1" >> "$GITHUB_ENV" ;;
            "0 2 * * *") echo "THREADS_SLOT=2" >> "$GITHUB_ENV" ;;
            "30 3 * * *") echo "THREADS_SLOT=3" >> "$GITHUB_ENV" ;;
            "0 5 * * *") echo "THREADS_SLOT=4" >> "$GITHUB_ENV" ;;
            "0 7 * * *") echo "THREADS_SLOT=5" >> "$GITHUB_ENV" ;;
            "0 9 * * *") echo "THREADS_SLOT=6" >> "$GITHUB_ENV" ;;
            "30 10 * * *") echo "THREADS_SLOT=7" >> "$GITHUB_ENV" ;;
            "0 12 * * *") echo "THREADS_SLOT=8" >> "$GITHUB_ENV" ;;
            "0 13 * * *") echo "THREADS_SLOT=9" >> "$GITHUB_ENV" ;;
            *) echo "Could not map schedule to slot: ${{ github.event.schedule }}" >&2; exit 1 ;;
          esac

      - name: Post to Threads
        id: post
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          if [ -n "${{ inputs.slot }}" ]; then
            ARGS+=(--slot "${{ inputs.slot }}")
          elif [ -n "${THREADS_SLOT:-}" ]; then
            ARGS+=(--slot "${THREADS_SLOT}")
          fi
          if [ -n "${{ inputs.genre }}" ]; then
            ARGS+=(--genre "${{ inputs.genre }}")
          fi
          python src/post.py "${ARGS[@]}"

      - name: Commit ledger if changed
        if: ${{ success() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- data/posted.json data/chitchat_pool.json data/ask_chitchat_pool.json data/trend_seeds.json data/reuse.json; then
            echo "No data file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json data/chitchat_pool.json data/ask_chitchat_pool.json data/trend_seeds.json data/reuse.json
          git commit -m "chore: update posted ledger / ask pool"
          git push
