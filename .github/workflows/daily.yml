name: Threads Rakuten daily post

# 毎日10回 JST。内訳は config.py の ITEM_SLOTS / VALUE_SLOTS / STRUGGLE_SLOTS / CHITCHAT_SLOTS 参照。
# ペルソナ A（家庭の消耗品・時短買い）向け。売り込みより共感を厚くしつつ、雑談で人間味を残す。
#   共働きリアル苦悩 5本: 07:00 / 12:00 / 17:00 / 21:00 / 22:00
#   どうでもいい雑談 2本: 08:00 / 15:00
#   攻略・保存ネタ 1本: 18:00
#   商品紹介(アフィリンク付き) 2本: 19:00 / 20:00
#   ※ 17:00 (slot 4) は再利用キュー優先

on:
  schedule:
    # 07:00 JST = 22:00 UTC (previous day) : slot 0 value
    - cron: "0 22 * * *"
    # 08:00 JST = 23:00 UTC (previous day) : slot 1 item
    - cron: "0 23 * * *"
    # 12:00 JST = 03:00 UTC : slot 2 value
    - cron: "0 3 * * *"
    # 15:00 JST = 06:00 UTC : slot 3 digest
    - cron: "0 6 * * *"
    # 17:00 JST = 08:00 UTC : slot 4 value
    - cron: "0 8 * * *"
    # 18:00 JST = 09:00 UTC : slot 5 digest
    - cron: "0 9 * * *"
    # 19:00 JST = 10:00 UTC : slot 6 digest
    - cron: "0 10 * * *"
    # 20:00 JST = 11:00 UTC : slot 7 item
    - cron: "0 11 * * *"
    # 21:00 JST = 12:00 UTC : slot 8 value
    - cron: "0 12 * * *"
    # 22:00 JST = 13:00 UTC : slot 9 digest
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do not publish / do not update ledger)"
        type: boolean
        default: true
      slot:
        description: "0..9 (see config.SLOT_LABELS; 1/7=item, 3/5/6/9=digest, others=value)"
        required: false
        default: ""
      genre:
        description: "Optional Rakuten genreId (empty = rotate by date+slot)"
        required: false
        default: ""

concurrency:
  group: threads-rakuten-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      THREADS_PUBLISH_DELAY_SEC: "8"
      THREADS_REPLY_GAP_SEC: "5"
      TZ: Asia/Tokyo
      PYTHONPATH: src:.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require secrets for publish
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          missing=0
          for key in THREADS_ACCESS_TOKEN THREADS_USER_ID RAKUTEN_APPLICATION_ID RAKUTEN_ACCESS_KEY RAKUTEN_AFFILIATE_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing secret: $key"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "See README.md for setup"
            exit 1
          fi

      - name: Resolve slot from schedule
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "0 22 * * *") echo "THREADS_SLOT=0" >> "$GITHUB_ENV" ;;
            "0 23 * * *") echo "THREADS_SLOT=1" >> "$GITHUB_ENV" ;;
            "0 3 * * *") echo "THREADS_SLOT=2" >> "$GITHUB_ENV" ;;
            "0 6 * * *") echo "THREADS_SLOT=3" >> "$GITHUB_ENV" ;;
            "0 8 * * *") echo "THREADS_SLOT=4" >> "$GITHUB_ENV" ;;
            "0 9 * * *") echo "THREADS_SLOT=5" >> "$GITHUB_ENV" ;;
            "0 10 * * *") echo "THREADS_SLOT=6" >> "$GITHUB_ENV" ;;
            "0 11 * * *") echo "THREADS_SLOT=7" >> "$GITHUB_ENV" ;;
            "0 12 * * *") echo "THREADS_SLOT=8" >> "$GITHUB_ENV" ;;
            "0 13 * * *") echo "THREADS_SLOT=9" >> "$GITHUB_ENV" ;;
            *) echo "Could not map schedule to slot: ${{ github.event.schedule }}" >&2; exit 1 ;;
          esac

      - name: Post to Threads
        id: post
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          if [ -n "${{ inputs.slot }}" ]; then
            ARGS+=(--slot "${{ inputs.slot }}")
          elif [ -n "${THREADS_SLOT:-}" ]; then
            ARGS+=(--slot "${THREADS_SLOT}")
          fi
          if [ -n "${{ inputs.genre }}" ]; then
            ARGS+=(--genre "${{ inputs.genre }}")
          fi
          python src/post.py "${ARGS[@]}"

      - name: Commit ledger if changed
        if: ${{ success() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- data/posted.json data/chitchat_pool.json data/reuse.json; then
            echo "No data file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json data/chitchat_pool.json data/reuse.json
          git commit -m "chore: update posted ledger / chitchat pool"
          git push
